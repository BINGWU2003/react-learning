<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">React 与 Vue 对照书页</title>
  <desc id="desc">打开的左右书页分别带有代码符号，表示同一主题的 React 与 Vue 实现对照。</desc>
  <style>
    .stroke {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: write 7.2s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .stroke-2 { animation-delay: .16s; }
    .stroke-3 { animation-delay: .3s; }
    .stroke-4 { animation-delay: .42s; }

    @keyframes write {
      0% { opacity: 0; stroke-dashoffset: 1; }
      5% { opacity: 1; }
      35%, 82% { opacity: 1; stroke-dashoffset: 0; }
      96% { opacity: 0; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stroke {
        animation: none;
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }
  </style>
  <g fill="none" stroke="#172033" stroke-linecap="round" stroke-linejoin="round">
    <path class="stroke stroke-1" pathLength="1" stroke-width="24" d="M68 122 C137 105 205 119 256 163 V418 C205 374 137 360 68 377 Z" />
    <path class="stroke stroke-2" pathLength="1" stroke-width="24" d="M444 122 C375 105 307 119 256 163 V418 C307 374 375 360 444 377 Z" />
    <path class="stroke stroke-3" pathLength="1" stroke-width="25" d="M198 222 L154 270 L198 318" />
    <path class="stroke stroke-4" pathLength="1" stroke-width="25" d="M314 222 L358 270 L314 318" />
  </g>
</svg>
